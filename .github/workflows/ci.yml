name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff==0.16.1
      - name: Lint (ruff check)
        run: ruff check src launcher.py tools tests
      - name: Format check
        run: ruff format --check src launcher.py tools tests
      - name: Tests
        run: pytest -q
